# Publicação da versão 2.0 no Render (https://render.com) — plano gratuito.
# No painel do Render: New > Blueprint > selecionar este repositório.
services:
  - type: web
    name: agenda-academica
    runtime: python
    plan: free
    rootDir: versao-2
    buildCommand: python --version
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Senha da conta do avaliador (usuário "avaliador" ou o definido em AGENDA_USUARIO).
      # O Render pede o valor na criação; ele não fica no repositório.
      - key: AGENDA_SENHA
        sync: false
